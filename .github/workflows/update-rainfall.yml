name: Update Rainfall Data

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run rainfall data backfill
        run: python -m pipeline.backfill_openmeteo

      - name: Run pipeline tests
        run: |
          pip install pytest httpx
          python -m pytest tests/test_rainfall_pipeline.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/master_dataset.csv
          git diff --cached --quiet || git commit -m "chore: auto-update rainfall data $(date -I)"
          git push
