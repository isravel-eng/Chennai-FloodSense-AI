name: Retrain FloodSense Model 2

on:
  push:
    branches: [machine-learning]
    paths:
      - 'data/raw/master_dataset.csv'
      - 'model_2_flood/**'
      - 'requirements.txt'
      - '.github/workflows/retrain-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build simple features
        run: python model_2_flood/feature_engineering.py

      - name: Train simple Random Forest
        run: python model_2_flood/train.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/flood_model.pkl data/processed/model2_features.csv data/processed/monthly_rainfall_citywide.csv
          git diff --cached --quiet && exit 0
          git commit -m "chore: retrain simple FloodSense model"
          git push
