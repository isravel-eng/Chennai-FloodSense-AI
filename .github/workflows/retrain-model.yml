name: Retrain FloodSense Model 2

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/master_dataset.csv'
      - 'model_2_flood/**'
      - 'requirements.txt'
      - '.github/workflows/retrain-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Rebuild features
        run: python model_2_flood/feature_engineering.py

      - name: Build preprocessing artifact
        run: python model_2_flood/preprocessing.py

      - name: Train and evaluate Model 2
        run: python model_2_flood/02_evaluation.py

      - name: Verify Model 2
        run: python -m pytest tests/test_model2.py tests/test_live_prediction.py tests/test_live_weather.py -v

      - name: Commit generated Model 2 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/flood_model.pkl models/flood_model_selection.pkl models/flood_preprocessing.pkl data/processed/model2_features.csv data/processed/locality_lookup.csv data/processed/monthly_rainfall_citywide.csv
          git diff --cached --quiet && exit 0
          git commit -m "chore: retrain FloodSense Model 2"
          git push
