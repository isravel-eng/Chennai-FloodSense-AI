services:
  - type: web
    name: chennai-floodsense-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: SUPABASE_URL
        sync: false          # set manually in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # set manually in Render dashboard — keep secret
      - key: FRONTEND_ORIGIN
        sync: false          # set to your Render frontend URL, e.g. https://chennai-floodsense-ai-1.onrender.com
      - key: REQUIRE_EMAIL_CONFIRMATION
        sync: false          # set to "true" to require email verification before login; default is "false" (auto-confirm, recommended for demo/staging)
